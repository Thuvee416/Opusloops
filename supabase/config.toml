project_id = "opusloops"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "https://opusloops.com/"
additional_redirect_urls = [
  "https://opusloops.com/**",
  "https://www.opusloops.com/**",
  "https://main.d1zc92wmtmvg23.amplifyapp.com/**",
  "http://127.0.0.1:4173/**",
  "http://127.0.0.1:4174/**",
  "http://localhost:4173/**",
]
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = false
enable_confirmations = false
double_confirm_changes = true

[functions.create-opusloops-account]
enabled = true
verify_jwt = false

[functions.stem-import]
enabled = true
verify_jwt = true

[functions.stem-worker-callback]
enabled = true
verify_jwt = false

[functions.stem-retention]
enabled = true
verify_jwt = false
