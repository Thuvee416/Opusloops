customHeaders:
  - pattern: '**'
    headers:
      - key: 'Strict-Transport-Security'
        value: 'max-age=31536000; includeSubDomains'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'X-Frame-Options'
        value: 'DENY'
      - key: 'Referrer-Policy'
        value: 'no-referrer'
      - key: 'Permissions-Policy'
        value: 'camera=(), geolocation=(), microphone=()'
      - key: 'Content-Security-Policy'
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob:; media-src 'self' blob: https://opusloops-uploads-368310207026-us-east-1.s3.us-east-1.amazonaws.com https://opusloops-sources-368310207026-us-east-1.s3.us-east-1.amazonaws.com https://opusloops-artifacts-368310207026-us-east-1.s3.us-east-1.amazonaws.com; connect-src 'self' https://2psb3vs3pl.execute-api.us-east-1.amazonaws.com https://opusloops-uploads-368310207026-us-east-1.s3.us-east-1.amazonaws.com https://opusloops-sources-368310207026-us-east-1.s3.us-east-1.amazonaws.com https://opusloops-artifacts-368310207026-us-east-1.s3.us-east-1.amazonaws.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
  - pattern: '/'
    headers:
      - key: 'Cache-Control'
        value: 'max-age=0, no-cache, no-store, must-revalidate'
  - pattern: '/index.html'
    headers:
      - key: 'Cache-Control'
        value: 'max-age=0, no-cache, no-store, must-revalidate'
  - pattern: '/service-worker.js'
    headers:
      - key: 'Cache-Control'
        value: 'max-age=0, no-cache, no-store, must-revalidate'
  - pattern: '/manifest.webmanifest'
    headers:
      - key: 'Cache-Control'
        value: 'max-age=0, no-cache, no-store, must-revalidate'
  - pattern: '/version.json'
    headers:
      - key: 'Cache-Control'
        value: 'max-age=0, no-cache, no-store, must-revalidate'
