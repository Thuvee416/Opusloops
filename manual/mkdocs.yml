site_name: Opusloops Guide
site_description: Guide to the Opusloops mobile web app

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Use light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  logo: assets/images/opusloops-mark.svg
  favicon: assets/images/opusloops-mark.svg
  icon:
    repo: fontawesome/brands/github

repo_url: https://github.com/Thuvee416/Opusloops
repo_name: Thuvee416/Opusloops

nav:
  - Home: index.md
  - Is Opusloops Right for You?: is-opusloops-right-for-you.md
  - Getting Started:
      - Install the PWA: getting-started/installation.md
      - Make Your First Loop: getting-started/first-session.md
  - Interface: interface/overview.md
  - Touch Sequencer: sequencer.md
  - Mixer: mixer.md
  - Projects and Offline Use: projects-offline.md
  - Troubleshooting: reference/troubleshooting.md
  - Legacy Desktop Compatibility: legacy-desktop.md

extra:
  homepage: https://opusloops.com/
  social:
    - icon: fontawesome/solid/play
      link: https://opusloops.com/
      name: Open Opusloops
    - icon: fontawesome/brands/github
      link: https://github.com/Thuvee416/Opusloops
      name: Source on GitHub

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - md_in_html
  - toc:
      permalink: true
