name: Mobile App Bug
description: Report a reproducible problem in the Opusloops PWA
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Opusloops. Do not include private projects, audio, or credentials.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the result and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open https://opusloops.com/
        2. Tap ...
        3. Observe ...
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and OS
      placeholder: "iPhone 15, iOS 19.0"
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "Safari 19"
    validations:
      required: true

  - type: dropdown
    id: launch-mode
    attributes:
      label: How did you open Opusloops?
      options:
        - Browser tab
        - Installed PWA / home-screen icon
    validations:
      required: true

  - type: dropdown
    id: connection
    attributes:
      label: Connection state
      options:
        - Online
        - Offline
        - Changed during the session
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Additional evidence
      description: Add a screenshot, screen recording, or browser-console error if it does not expose private content.
    validations:
      required: false
