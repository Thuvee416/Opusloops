name: Feature Request
description: Suggest a focused improvement to the mobile Opusloops workflow
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: What are you trying to do?
      description: Describe the musical task or friction before proposing a control.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would make it easier?
      description: Keep the touch-first, built-in Web Audio, local-first product boundary in mind.
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device or viewport
      placeholder: "iPhone portrait"
    validations:
      required: false
