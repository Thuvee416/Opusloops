name: Feature Request
description: Suggest a focused improvement to the Opusloops music workflow
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: What are you trying to do?
      description: Describe the musical task or friction before proposing a control.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would make it easier?
      description: Describe the musical outcome, current workaround, and whether this is for mobile, desktop, or both. Check ROADMAP.md for related proposals.
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device or viewport
      placeholder: "iPhone portrait"
    validations:
      required: false
