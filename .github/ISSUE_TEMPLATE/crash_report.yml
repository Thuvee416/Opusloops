name: App Reload or Data-Loss Report
description: Report an unexpected reload, freeze, or missing local project
labels: ["bug", "data-safety"]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste private project data publicly. Opusloops has no cloud or file backup in this release.

  - type: textarea
    id: event
    attributes:
      label: What failed?
      description: Describe the freeze, reload, blank screen, audio interruption, or missing project.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: What happened immediately before it?
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device, OS, and browser
      placeholder: "Pixel 10, Android 17, Chrome 141"
    validations:
      required: true

  - type: dropdown
    id: launch-mode
    attributes:
      label: Launch mode
      options:
        - Browser tab
        - Installed PWA / home-screen icon
    validations:
      required: true

  - type: textarea
    id: storage-events
    attributes:
      label: Recent storage or app changes
      description: Note private browsing, cleared site data, browser updates, low-storage warnings, or PWA reinstallations.
    validations:
      required: false

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Include visible errors or browser-console output, with private data removed.
      render: text
    validations:
      required: false
