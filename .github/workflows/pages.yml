name: Deploy Opusloops mobile app

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: opusloops-pages
  cancel-in-progress: true

jobs:
  build:
    name: Validate mobile app
    if: github.repository_owner == 'Thuvee416' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Validate static PWA
        shell: bash
        run: |
          set -euo pipefail
          for required in index.html styles.css app.js manifest.webmanifest service-worker.js icons/icon-192.png icons/icon-512.png icons/apple-touch-icon.png; do
            if [[ ! -s "mobile/$required" ]]; then
              echo "::error file=mobile/$required::Required mobile asset is missing or empty."
              exit 1
            fi
          done

          python3 - <<'PY'
          import json
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote, urlsplit

          class PageParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.has_viewport = False
                  self.has_manifest = False
                  self.local_assets = []

              def handle_starttag(self, tag, attrs):
                  attributes = dict(attrs)
                  if tag == "meta" and attributes.get("name", "").lower() == "viewport":
                      self.has_viewport = True
                  if tag == "link" and "manifest" in attributes.get("rel", "").lower().split():
                      self.has_manifest = True
                  for attribute in ("href", "src"):
                      value = attributes.get(attribute)
                      if value:
                          self.local_assets.append(value)

          root = Path("mobile")
          index_path = root / "index.html"
          manifest_path = root / "manifest.webmanifest"
          parser = PageParser()
          parser.feed(index_path.read_text(encoding="utf-8"))
          if not parser.has_viewport:
              raise SystemExit(f"{index_path}: mobile viewport metadata is required")
          if not parser.has_manifest:
              raise SystemExit(f"{index_path}: the PWA manifest must be linked")

          for reference in parser.local_assets:
              parsed = urlsplit(reference)
              if parsed.scheme or parsed.netloc or not parsed.path:
                  continue
              if parsed.path.startswith("/"):
                  raise SystemExit(
                      f"{index_path}: root-relative asset {reference!r} breaks on the /Opusloops-Mobile/ Pages path"
                  )
              asset_path = root / unquote(parsed.path)
              if not asset_path.is_file():
                  raise SystemExit(f"{index_path}: referenced asset is missing: {asset_path}")

          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          for field in ("name", "short_name", "start_url", "display", "icons"):
              if not manifest.get(field):
                  raise SystemExit(f"{manifest_path}: missing required PWA field {field!r}")
          if manifest["name"] != "Opusloops" or manifest["short_name"] != "Opusloops":
              raise SystemExit(f"{manifest_path}: PWA name and short_name must both be Opusloops")

          for field in ("start_url", "scope"):
              value = manifest.get(field)
              if value and (value.startswith("/") or urlsplit(value).scheme or urlsplit(value).netloc):
                  raise SystemExit(
                      f"{manifest_path}: {field} must be relative so it works under /Opusloops-Mobile/, got {value!r}"
                  )

          for icon in manifest["icons"]:
              source = icon.get("src", "").split("?", 1)[0].split("#", 1)[0]
              parsed = urlsplit(source)
              if not source or source.startswith("/") or parsed.scheme or parsed.netloc:
                  raise SystemExit(f"{manifest_path}: icons must use relative local paths, got {source!r}")
              icon_path = root / unquote(parsed.path)
              if not icon_path.is_file() or icon_path.stat().st_size == 0:
                  raise SystemExit(f"{manifest_path}: referenced icon is missing: {icon_path}")
          PY

          node --check mobile/app.js
          node --check mobile/service-worker.js

          if grep -RniE 'magda|conceptual machines|anthropic' mobile; then
            echo "::error::Production mobile files contain retired or third-party product branding."
            exit 1
          fi

      - name: Stamp deployment provenance
        shell: bash
        run: |
          printf '{"commit":"%s","repository":"%s","ref":"%s","runId":"%s","runAttempt":"%s","builtAt":"%s"}\n' \
            "$GITHUB_SHA" \
            "$GITHUB_REPOSITORY" \
            "$GITHUB_REF" \
            "$GITHUB_RUN_ID" \
            "$GITHUB_RUN_ATTEMPT" \
            "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            > mobile/version.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: mobile

  deploy:
    name: Deploy mobile app
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
