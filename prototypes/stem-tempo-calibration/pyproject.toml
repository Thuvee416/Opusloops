[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opusloops-stem-calibration"
version = "0.1.0"
description = "Production-isolated calibration harness for Opusloops stem tempo maps"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [{ name = "Opusloops" }]
dependencies = [
  "jsonschema==4.25.1",
  "referencing==0.37.0",
]

[project.optional-dependencies]
analysis = [
  "beat-this==1.1.0",
  "imageio-ffmpeg==0.6.0",
  "librosa==0.11.0",
  "numpy>=2.0,<3",
  "soundfile==0.13.1",
]
dev = [
  "pytest==8.4.2",
  "ruff==0.12.11",
]

[project.scripts]
opus-stem-cal = "opusloops_stem_calibration.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opusloops_stem_calibration = ["schemas/*.json"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
